shreks-g1c-v2-runtime-manifest-candidate-authority-bind = "shreks_brain.g1c_v2_runtime_manifest_candidate_authority:main"
shreks-g1c-v2-candidate-value-decision = "shreks_brain.g1c_v2_candidate_value_decision:main"
shreks-g1c-v2-candidate-value-preflight = "shreks_brain.g1c_v2_candidate_value_preflight:main"
shreks-g1c-v2-decision-backed-candidate-authority-bind = "shreks_brain.g1c_v2_decision_backed_candidate_authority:main"
shreks-g1c-v2-decision-backed-candidate-author = "shreks_brain.g1c_v2_decision_backed_candidate_authoring:main"
shreks-g1c-v2-decision-backed-transition-bind = "shreks_brain.g1c_v2_decision_backed_transition_binding:main"
shreks-g1c-v2-decision-backed-rotation-readiness = "shreks_brain.g1c_v2_decision_backed_rotation_readiness:main"
shreks-g1c-v2-decision-backed-rotation-plan = "shreks_brain.g1c_v2_decision_backed_rotation_plan:main"
shreks-g1c-v2-entry-sizing-proposal = "shreks_brain.g1c_v2_entry_sizing_proposal:main"
shreks-g1c-v2-quote-valuation-reference = "shreks_brain.g1c_v2_quote_valuation_reference:main"
shreks-g1c-v2-quote-valuation-review = "shreks_brain.g1c_v2_quote_valuation_review:main"
shreks-g1c-v2-review-backed-entry-sizing = "shreks_brain.g1c_v2_review_backed_entry_sizing:main"
shreks-g1c-v2-runtime-manifest-transition-bind = "shreks_brain.g1c_v2_runtime_manifest_transition_binding:main"
shreks-g1c-v2-paper-manifest-manager-install = "shreks_brain.g1c_v2_paper_manifest_manager_install:main"
shreks-g1c-v2-paper-manifest-manager-install-proof = "shreks_brain.g1c_v2_paper_manifest_manager_installation_proof:main"
shreks-g1c-v2-paper-manifest-manager-install-proof-refresh = "shreks_brain.g1c_v2_paper_manifest_manager_installation_proof_refresh:main"

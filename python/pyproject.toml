[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shreks-brain"
version = "0.1.0"
description = "Decision, research, and learning layer for Shreks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shreks-fast-deterministic-campaign = "shreks_brain.fast_deterministic_campaign.cli:main"
shreks-fast-proof-workspace = "shreks_brain.fast_proof_workspace:main"
shreks-fast-first-champion-run = "shreks_brain.fast_first_champion_host_run:main"
shreks-fast-context-policy-from-runtime = "shreks_brain.fast_runtime_hydration_policy:main"
shreks-fast-first-champion-request = "shreks_brain.fast_first_champion_host_request_writer:main"
shreks-fl9-v2-cohort-acceptance = "shreks_brain.fl9_v2_cohort_acceptance.cli:main"
shreks-fl9-v2-future-path-backfill = "shreks_brain.fl9_v2_future_path_backfill:main"
shreks-fl9-v2-runtime-manifest-discovery = "shreks_brain.fl9_v2_runtime_manifest_discovery:main"
shreks-fl9-v2-runtime-manifest-candidate-assessment = "shreks_brain.fl9_v2_runtime_manifest_candidate_assessment:main"
shreks-g1c-v2-runtime-manifest-candidate-author = "shreks_brain.g1c_v2_runtime_manifest_candidate_authoring:main"
shreks-g1c-v2-runtime-manifest-candidate-authority-bind = "shreks_brain.g1c_v2_runtime_manifest_candidate_authority:main"
shreks-g1c-v2-entry-sizing-proposal = "shreks_brain.g1c_v2_entry_sizing_proposal:main"
shreks-g1c-v2-quote-valuation-reference = "shreks_brain.g1c_v2_quote_valuation_reference:main"
shreks-g1c-v2-quote-valuation-review = "shreks_brain.g1c_v2_quote_valuation_review:main"
shreks-g1c-v2-runtime-manifest-transition-bind = "shreks_brain.g1c_v2_runtime_manifest_transition_binding:main"
shreks-g1c-v2-paper-manifest-manager-install = "shreks_brain.g1c_v2_paper_manifest_manager_install:main"
shreks-g1c-v2-paper-manifest-manager-install-proof = "shreks_brain.g1c_v2_paper_manifest_manager_installation_proof:main"
shreks-g1c-v2-paper-manifest-manager-install-plan = "shreks_brain.g1c_v2_paper_manifest_manager_install_plan:main"
shreks-g1c-v2-paper-manifest-manager-status = "shreks_brain.g1c_v2_paper_manifest_manager_status:main"
shreks-g1c-v2-paper-manifest-rotation-readiness = "shreks_brain.g1c_v2_paper_manifest_rotation_readiness:main"
shreks-fl9-v2-discovery-authority-bind = "shreks_brain.fl9_v2_discovery_authority_binding:main"
# Legacy module remains sealed for helper/unit-test compatibility; production
# execution is routed through the cohort-bounded runner below.
# shreks-fl9-v2-first-champion = "shreks_brain.fast_first_champion_v2.host_run:main"
shreks-fl9-v2-first-champion = "shreks_brain.fast_first_champion_v2.bounded_host_run:main"

[project.optional-dependencies]
research = ["pyarrow==25.0.*"]
learning = ["scikit-learn>=1.7,<2"]
dev = ["pytest>=8,<9", "pyarrow==25.0.*", "scikit-learn>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shreks_brain._sealed_fast_tools" = ["*.bin", "manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

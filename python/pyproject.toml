[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shreks-brain"
version = "0.1.0"
description = "Decision, research, and learning layer for Shreks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shreks-fast-deterministic-campaign = "shreks_brain.fast_deterministic_campaign.cli:main"
shreks-fast-proof-workspace = "shreks_brain.fast_proof_workspace:main"\nshreks-fast-first-champion-run = "shreks_brain.fast_first_champion_host_run:main"

[project.optional-dependencies]
research = ["pyarrow==25.0.*"]
learning = ["scikit-learn>=1.7,<2"]
dev = ["pytest>=8,<9", "pyarrow==25.0.*", "scikit-learn>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shreks_brain._sealed_fast_tools" = ["*.bin", "manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

shreks-fast-paper-shadow-outcome-telemetry = "shreks_brain.fast_paper_shadow_outcome_telemetry:main"
shreks-fast-paper-shadow-execution-telemetry = "shreks_brain.fast_paper_shadow_execution_telemetry:main"
shreks-fast-paper-shadow-sample-proof = "shreks_brain.fast_paper_shadow_sample_proof:main"
shreks-fast-paper-shadow-trade-economics = "shreks_brain.fast_paper_shadow_trade_economics:main"
shreks-fast-paper-shadow-missed-opportunity = "shreks_brain.fast_paper_shadow_missed_opportunity:main"
shreks-fast-paper-shadow-latency-proof = "shreks_brain.fast_paper_shadow_latency_proof:main"
shreks-fast-paper-shadow-promotion-readiness = "shreks_brain.fast_paper_shadow_promotion_readiness:main"
shreks-fast-paper-champion-promotion = "shreks_brain.fast_paper_champion_promotion:main"
shreks-fast-paper-cutover-preflight = "shreks_brain.fast_paper_cutover_preflight:main"
shreks-fast-paper-authoritative-cutover-baseline = "shreks_brain.fast_paper_authoritative_cutover_baseline:main"
shreks-fast-paper-authoritative-host-prepare = "shreks_brain.fast_paper_authoritative_host_prepare:main"
shreks-fast-paper-physical-cutover = "shreks_brain.fast_paper_physical_cutover:main"
shreks-fast-paper-release-upgrade = "shreks_brain.fast_paper_release_upgrade:main"
shreks-fast-paper-manual-recovery = "shreks_brain.fast_paper_manual_recovery:main"
shreks-fast-paper-release-manager-install-proof = "shreks_brain.fast_paper_release_manager_installation_proof:main"

[project.optional-dependencies]
research = ["pyarrow==25.0.*"]
learning = ["scikit-learn>=1.7,<2"]
dev = ["pytest>=8,<9", "pyarrow==25.0.*", "scikit-learn>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shreks_brain._sealed_fast_tools" = ["*.bin", "manifest.json"]
"shreks_brain._sealed_fast_runtime_tools" = ["*.bin", "manifest.json"]
"shreks_brain._sealed_fast_paper_shadow_commissioning" = ["manifest.json", "*.service", "*.example"]
"shreks_brain._sealed_fast_paper_authoritative_commissioning" = ["manifest.json", "*.service", "*.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

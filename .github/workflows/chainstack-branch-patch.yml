name: Chainstack branch patch

on:
  push:
    branches:
      - fix/fl1-chainstack-realtime-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fl1-chainstack-realtime-fallback
          fetch-depth: 0
      - name: Apply asserted Chainstack production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Standard Solana realtime adapter: Chainstack uses the same logsSubscribe wire contract.
          path = "crates/shreks-providers/src/pump_realtime.rs"
          marker = "    /// Backward-compatible local/test constructor. Historical endpoint-only\n"
          insertion = '''    pub fn chainstack(endpoint: &str) -> Result<Self, ProviderError> {
              let endpoint = endpoint.trim();
              if endpoint.is_empty() {
                  return Err(ProviderError::new(
                      ProviderId::Chainstack,
                      ProviderErrorKind::InvalidRequest,
                      "Chainstack Solana websocket endpoint must not be empty",
                  ));
              }
              Self::for_provider_endpoint(ProviderId::Chainstack, endpoint.to_owned())
          }

          '''
          replace_once(path, marker, insertion + marker)
          replace_once(
              path,
              '"Pump realtime provider must be Helius or Alchemy",',
              '"Pump realtime provider must be Helius, Chainstack, or Alchemy",',
          )
          replace_once(
              path,
              "matches!(provider, ProviderId::Helius | ProviderId::Alchemy)",
              "matches!(\n        provider,\n        ProviderId::Helius | ProviderId::Chainstack | ProviderId::Alchemy\n    )",
          )

          # Observe-only provider plan and durable writer identity validation.
          path = "crates/shreks-observer/src/runtime.rs"
          replace_once(
              path,
              '''    if config.alchemy_enabled() {
                  realtime.push(ProviderId::Alchemy);
              }
          ''',
              '''    if config.chainstack_enabled() {
                  realtime.push(ProviderId::Chainstack);
              }
              if config.alchemy_enabled() {
                  realtime.push(ProviderId::Alchemy);
              }
          ''',
          )
          replace_once(
              path,
              "if !matches!(notification.provider, ProviderId::Helius | ProviderId::Alchemy) {",
              "if !matches!(\n        notification.provider,\n        ProviderId::Helius | ProviderId::Chainstack | ProviderId::Alchemy\n    ) {",
          )
          replace_once(
              path,
              '"Pump realtime notification provider must be Helius or Alchemy".to_owned(),',
              '"Pump realtime notification provider must be Helius, Chainstack, or Alchemy".to_owned(),',
          )

          # Production builder order: Helius -> Chainstack -> Alchemy.
          path = "crates/shreks-observer/src/bin/shreks-observe.rs"
          replace_once(
              path,
              '''    // One active standard-Solana websocket carries both Pump lanes. Helius is
              // preferred when configured; Alchemy is the free secondary. Provider
              // exhaustion rotates sources before the durability lane is allowed to fail.
          ''',
              '''    // One active standard-Solana websocket carries both Pump lanes. Helius is
              // preferred when configured; Chainstack is the proven free fallback and Alchemy
              // remains tertiary. Provider exhaustion rotates sources before durability may fail.
          ''',
          )
          replace_once(
              path,
              '''    if let Some(api_key) = config.alchemy_api_key() {
                  configs.push(PumpRealtimeLogStreamConfig::alchemy(api_key)?);
              }
          ''',
              '''    if let Some(endpoint) = config.chainstack_solana_wss_url() {
                  configs.push(PumpRealtimeLogStreamConfig::chainstack(endpoint)?);
              }
              if let Some(api_key) = config.alchemy_api_key() {
                  configs.push(PumpRealtimeLogStreamConfig::alchemy(api_key)?);
              }
          ''',
          )

          # Durable raw/canonical decoders retain truthful provider provenance.
          for path in [
              "crates/shreks-storage/src/fast_lane.rs",
              "crates/shreks-storage/src/pump_swap_fast_lane.rs",
          ]:
              replace_once(
                  path,
                  '        "alchemy" => Ok(ProviderId::Alchemy),\n',
                  '        "alchemy" => Ok(ProviderId::Alchemy),\n        "chainstack" => Ok(ProviderId::Chainstack),\n',
              )

          # Canonical FastEvent conversion accepts only audited realtime providers.
          path = "crates/shreks-observer/src/fast_event_normalizer.rs"
          replace_once(
              path,
              "ProviderId::Helius | ProviderId::Alchemy",
              "ProviderId::Helius | ProviderId::Chainstack | ProviderId::Alchemy",
          )

          # Host-only endpoint template. Blank means disabled; never commit a real endpoint.
          path = ".env.example"
          replace_once(
              path,
              "ALCHEMY_API_KEY=\n",
              "ALCHEMY_API_KEY=\nCHAINSTACK_SOLANA_WSS_URL=\n",
          )

          # Acceptance documentation: endpoint is credential material and provenance is explicit.
          path = "docs/operations/FL1_FAST_LANE_ACCEPTANCE.md"
          p = Path(path)
          text = p.read_text()
          old = "FL1 realtime may be configured with `HELIUS_API_KEY` as primary and `ALCHEMY_API_KEY` as the secondary standard-Solana websocket source. Keys belong only in protected host runtime configuration. Never print either key, put either value in this runbook, copy either value into an evidence bundle, or expose the service environment with commands such as `systemctl show ... -p Environment`."
          new = "FL1 realtime may be configured with `HELIUS_API_KEY` as primary, host-only `CHAINSTACK_SOLANA_WSS_URL` as the proven secondary standard-Solana websocket source, and `ALCHEMY_API_KEY` as tertiary. The Chainstack endpoint itself contains credential material. Provider credentials/endpoints belong only in protected host runtime configuration. Never print them, put their values in this runbook, copy them into an evidence bundle, or expose the service environment with commands such as `systemctl show ... -p Environment`."
          if text.count(old) != 1:
              raise SystemExit("acceptance runbook provider-config paragraph drifted")
          text = text.replace(old, new, 1)
          text = text.replace(
              "`provider-counts.txt` contains only recognized realtime provenance (`helius` and/or `alchemy`)",
              "`provider-counts.txt` contains only recognized realtime provenance (`helius`, `chainstack`, and/or `alchemy`)",
          )
          text = text.replace(
              "accepted fallback evidence should contain `alchemy` rows rather than relabeling them as Helius.",
              "accepted fallback evidence should contain `chainstack` rows when Chainstack is configured rather than relabeling them as Helius. Alchemy counts are acceptable only when its websocket subscription actually acknowledges and carries traffic.",
          )
          text = text.replace(
              "A Helius quota error is not by itself an FL1.5 failure when an explicitly configured Alchemy fallback is demonstrably carrying representative Pump/PumpSwap traffic with intact canonical progress.",
              "A Helius quota error is not by itself an FL1.5 failure when an explicitly configured Chainstack (or independently proven Alchemy) fallback is demonstrably carrying representative Pump/PumpSwap traffic with intact canonical progress.",
          )
          p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chainstack-branch-patch.yml
          git add crates .env.example docs/operations/FL1_FAST_LANE_ACCEPTANCE.md
          git diff --cached --check
          git commit -m "feat: add Chainstack realtime fallback"
          git push origin HEAD:fix/fl1-chainstack-realtime-fallback

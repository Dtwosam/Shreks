name: FL1 branch storage patch

on:
  push:
    branches:
      - fix/fl1-realtime-provider-failover

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply FL1 storage provider parser patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fl1-realtime-provider-failover
      - name: Add Alchemy provider decoding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('crates/shreks-storage/src/fast_lane.rs'),
              Path('crates/shreks-storage/src/pump_swap_fast_lane.rs'),
          ]
          old = '        "helius" => Ok(ProviderId::Helius),\n        "jupiter" => Ok(ProviderId::Jupiter),'
          new = '        "helius" => Ok(ProviderId::Helius),\n        "alchemy" => Ok(ProviderId::Alchemy),\n        "jupiter" => Ok(ProviderId::Jupiter),'
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one parser anchor, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- crates/shreks-storage/src/fast_lane.rs crates/shreks-storage/src/pump_swap_fast_lane.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/shreks-storage/src/fast_lane.rs crates/shreks-storage/src/pump_swap_fast_lane.rs
          git commit -m 'fix: decode Alchemy fast-lane provenance'
          git push origin HEAD:fix/fl1-realtime-provider-failover

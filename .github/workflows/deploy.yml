name: Deploy verified Shreks release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag shreks-<40-char-sha>
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    environment: production-paper
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate existing release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^shreks-[0-9a-f]{40}$ ]]; then
            echo "release_tag must match shreks-<40 lowercase hex characters>" >&2
            exit 2
          fi
          SOURCE_SHA="${RELEASE_TAG#shreks-}"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Checkout released verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Download exact release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          gh release download "$RELEASE_TAG" \
            --pattern "shreks-release-$SOURCE_SHA.tar.gz" \
            --pattern "shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            --pattern "RELEASE_MANIFEST.json" \
            --dir dist/deploy

          test -f "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz"
          test -f "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          test -f "dist/deploy/RELEASE_MANIFEST.json"
          test "$(find dist/deploy -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Verify release locally before host contact
        shell: bash
        run: |
          set -euo pipefail
          python deploy/release/release_bundle.py verify \
            --archive "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz" \
            --checksum "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            --manifest "dist/deploy/RELEASE_MANIFEST.json"

      - name: Transfer verified assets and invoke host release manager
        shell: bash
        env:
          SHREKS_DEPLOY_HOST: ${{ secrets.SHREKS_DEPLOY_HOST }}
          SHREKS_DEPLOY_PORT: ${{ secrets.SHREKS_DEPLOY_PORT }}
          SHREKS_DEPLOY_USER: ${{ secrets.SHREKS_DEPLOY_USER }}
          SHREKS_DEPLOY_SSH_KEY: ${{ secrets.SHREKS_DEPLOY_SSH_KEY }}
          SHREKS_DEPLOY_KNOWN_HOSTS: ${{ secrets.SHREKS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$SHREKS_DEPLOY_HOST" || ! "$SHREKS_DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "invalid deployment host" >&2
            exit 2
          fi
          if [[ -z "$SHREKS_DEPLOY_USER" || ! "$SHREKS_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "invalid deployment user" >&2
            exit 2
          fi
          if [[ ! "$SHREKS_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( SHREKS_DEPLOY_PORT < 1 || SHREKS_DEPLOY_PORT > 65535 )); then
            echo "invalid deployment port" >&2
            exit 2
          fi
          if [[ -z "$SHREKS_DEPLOY_SSH_KEY" || -z "$SHREKS_DEPLOY_KNOWN_HOSTS" ]]; then
            echo "deployment key material and pinned host keys are required" >&2
            exit 2
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          KEY_FILE="$TEMP_DIR/deploy_key"
          KNOWN_HOSTS_FILE="$TEMP_DIR/known_hosts"
          umask 077
          printf '%s\n' "$SHREKS_DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$SHREKS_DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          ARCHIVE="dist/deploy/shreks-release-$SOURCE_SHA.tar.gz"
          CHECKSUM="dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          MANIFEST="dist/deploy/RELEASE_MANIFEST.json"
          DESTINATION="$SHREKS_DEPLOY_USER@$SHREKS_DEPLOY_HOST"
          SSH_COMMON=(-i "$KEY_FILE" -p "$SHREKS_DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o BatchMode=yes)
          SCP_COMMON=(-q -i "$KEY_FILE" -P "$SHREKS_DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o BatchMode=yes)

          REQUIRED_BYTES=$(( $(stat -c '%s' "$ARCHIVE") + $(stat -c '%s' "$CHECKSUM") + $(stat -c '%s' "$MANIFEST") ))
          REQUIRED_KB=$(( (REQUIRED_BYTES + 1023) / 1024 + 1024 ))

          echo "remote staging preflight"
          REMOTE_AVAIL_KB="$(ssh "${SSH_COMMON[@]}" "$DESTINATION" "set -e; test -d /var/tmp; test -w /var/tmp; df -Pk /var/tmp | tail -n 1 | awk '{print \$4}'")"
          if [[ ! "$REMOTE_AVAIL_KB" =~ ^[0-9]+$ ]]; then
            echo "unable to determine available /var/tmp space" >&2
            exit 2
          fi
          echo "required_kb=$REQUIRED_KB"
          echo "remote_available_kb=$REMOTE_AVAIL_KB"
          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "printf 'var_tmp='; stat -c '%A %U:%G %a' /var/tmp; df -Pk /var/tmp; df -Pi /var/tmp; printf 'legacy_partial='; if test -e '/var/tmp/shreks-release-$SOURCE_SHA.tar.gz'; then ls -l '/var/tmp/shreks-release-$SOURCE_SHA.tar.gz'; else echo none; fi"
          if (( REMOTE_AVAIL_KB < REQUIRED_KB )); then
            echo "insufficient remote /var/tmp space for verified release transfer" >&2
            exit 28
          fi

          REMOTE_DIR="$(ssh "${SSH_COMMON[@]}" "$DESTINATION" "mktemp -d '/var/tmp/shreks-deploy-$SOURCE_SHA.XXXXXX'")"
          if [[ ! "$REMOTE_DIR" =~ ^/var/tmp/shreks-deploy-$SOURCE_SHA\.[A-Za-z0-9]+$ ]]; then
            echo "unexpected remote staging directory: $REMOTE_DIR" >&2
            exit 2
          fi
          REMOTE_ARCHIVE="$REMOTE_DIR/shreks-release-$SOURCE_SHA.tar.gz"
          REMOTE_CHECKSUM="$REMOTE_DIR/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          REMOTE_MANIFEST="$REMOTE_DIR/RELEASE_MANIFEST.json"

          TRANSFER_RC=0
          set +e
          scp "${SCP_COMMON[@]}" "$ARCHIVE" "$DESTINATION:$REMOTE_ARCHIVE"
          TRANSFER_RC=$?
          if (( TRANSFER_RC == 0 )); then
            scp "${SCP_COMMON[@]}" "$CHECKSUM" "$DESTINATION:$REMOTE_CHECKSUM"
            TRANSFER_RC=$?
          fi
          if (( TRANSFER_RC == 0 )); then
            scp "${SCP_COMMON[@]}" "$MANIFEST" "$DESTINATION:$REMOTE_MANIFEST"
            TRANSFER_RC=$?
          fi
          set -e
          if (( TRANSFER_RC != 0 )); then
            echo "verified release transfer failed; collecting remote staging diagnostics" >&2
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "df -Pk /var/tmp || true; df -Pi /var/tmp || true; ls -ld '$REMOTE_DIR' || true; ls -la '$REMOTE_DIR' || true; rm -rf '$REMOTE_DIR'" || true
            exit "$TRANSFER_RC"
          fi

          set +e
          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "sudo /usr/local/sbin/shreks-release-manager install '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST'"
          DEPLOY_RC=$?
          set -e

          if (( DEPLOY_RC != 0 )); then
            echo "release manager failed; collecting read-only host diagnostics" >&2
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "printf 'current_release='; readlink -f /opt/shreks/current || true; printf 'candidate_release_present='; if test -d '/opt/shreks/releases/$SOURCE_SHA'; then echo yes; else echo no; fi; systemctl is-active shreks.target || true; systemctl show shreks-observe.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks-paper-evidence.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks-paper-campaign.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks.target -p ActiveState -p SubState --no-pager || true" || true
            ssh "${SSH_COMMON[@]}" "$DESTINATION" "rm -rf '$REMOTE_DIR'" || true
            exit "$DEPLOY_RC"
          fi

          ssh "${SSH_COMMON[@]}" "$DESTINATION" "rm -rf '$REMOTE_DIR'"

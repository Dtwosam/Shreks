name: Deploy verified Shreks release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag shreks-<40-char-sha>
        required: true
        type: string
  workflow_run:
    workflows: ["Build sealed Shreks release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shreks-production-paper-deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_run'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RELEASE_RUN_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Resolve exact immutable release identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            [[ "$RELEASE_RUN_CONCLUSION" == "success" ]] || exit 1
            [[ "$RELEASE_RUN_EVENT" == "workflow_run" ]] || exit 1
            SOURCE_SHA="$RELEASE_RUN_HEAD_SHA"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
            RELEASE_TAG="shreks-$SOURCE_SHA"
          else
            RELEASE_TAG="$MANUAL_RELEASE_TAG"
            [[ "$RELEASE_TAG" =~ ^shreks-[0-9a-f]{40}$ ]] || exit 2
            SOURCE_SHA="${RELEASE_TAG#shreks-}"
          fi
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    environment: production-paper
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate resolved release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$RELEASE_TAG" =~ ^shreks-[0-9a-f]{40}$ ]] || exit 2
          test "$RELEASE_TAG" = "shreks-$SOURCE_SHA"

      - name: Checkout released verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 1

      - name: Verify immutable GitHub release identity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/shreks-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          python - "$RELEASE_JSON" "$RELEASE_TAG" "$SOURCE_SHA" <<'PY'
          import json
          import sys

          path, expected_tag, expected_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              release = json.load(handle)
          if release.get("tag_name") != expected_tag:
              raise SystemExit("release tag mismatch")
          if release.get("target_commitish") != expected_sha:
              raise SystemExit("release target_commitish mismatch")
          if release.get("draft") is not False:
              raise SystemExit("release draft state is forbidden")
          if release.get("prerelease") is not False:
              raise SystemExit("release prerelease state is forbidden")
          if release.get("immutable") is not True:
              raise SystemExit("release is not immutable")
          names = sorted(asset.get("name") for asset in release.get("assets", []))
          expected = sorted(
              (
                  "RELEASE_MANIFEST.json",
                  f"shreks-release-{expected_sha}.tar.gz",
                  f"shreks-release-{expected_sha}.tar.gz.sha256",
              )
          )
          if names != expected:
              raise SystemExit("release asset set mismatch")
          PY

      - name: Download exact release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          gh release download "$RELEASE_TAG" \
            --pattern "shreks-release-$SOURCE_SHA.tar.gz" \
            --pattern "shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            --pattern "RELEASE_MANIFEST.json" \
            --dir dist/deploy

          test -f "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz"
          test -f "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          test -f "dist/deploy/RELEASE_MANIFEST.json"
          test "$(find dist/deploy -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Verify release locally before host contact
        shell: bash
        run: |
          set -euo pipefail
          python deploy/release/release_bundle.py verify \
            --archive "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz" \
            --checksum "dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            --manifest "dist/deploy/RELEASE_MANIFEST.json"

      - name: Transfer verified assets and invoke host release manager
        shell: bash
        env:
          SHREKS_DEPLOY_HOST: ${{ secrets.SHREKS_DEPLOY_HOST }}
          SHREKS_DEPLOY_PORT: ${{ secrets.SHREKS_DEPLOY_PORT }}
          SHREKS_DEPLOY_USER: ${{ secrets.SHREKS_DEPLOY_USER }}
          SHREKS_DEPLOY_SSH_KEY: ${{ secrets.SHREKS_DEPLOY_SSH_KEY }}
          SHREKS_DEPLOY_KNOWN_HOSTS: ${{ secrets.SHREKS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$SHREKS_DEPLOY_HOST" || ! "$SHREKS_DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "invalid deployment host" >&2
            exit 2
          fi
          if [[ -z "$SHREKS_DEPLOY_USER" || ! "$SHREKS_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "invalid deployment user" >&2
            exit 2
          fi
          if [[ ! "$SHREKS_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( SHREKS_DEPLOY_PORT < 1 || SHREKS_DEPLOY_PORT > 65535 )); then
            echo "invalid deployment port" >&2
            exit 2
          fi
          if [[ -z "$SHREKS_DEPLOY_SSH_KEY" || -z "$SHREKS_DEPLOY_KNOWN_HOSTS" ]]; then
            echo "deployment key material and pinned host keys are required" >&2
            exit 2
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          KEY_FILE="$TEMP_DIR/deploy_key"
          KNOWN_HOSTS_FILE="$TEMP_DIR/known_hosts"
          umask 077
          printf '%s\n' "$SHREKS_DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$SHREKS_DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          ARCHIVE="dist/deploy/shreks-release-$SOURCE_SHA.tar.gz"
          CHECKSUM="dist/deploy/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          MANIFEST="dist/deploy/RELEASE_MANIFEST.json"
          DESTINATION="$SHREKS_DEPLOY_USER@$SHREKS_DEPLOY_HOST"
          SSH_COMMON=(-i "$KEY_FILE" -p "$SHREKS_DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o BatchMode=yes)
          SCP_COMMON=(-q -i "$KEY_FILE" -P "$SHREKS_DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o BatchMode=yes)

          REQUIRED_BYTES=$(( $(stat -c '%s' "$ARCHIVE") + $(stat -c '%s' "$CHECKSUM") + $(stat -c '%s' "$MANIFEST") ))
          REQUIRED_KB=$(( (REQUIRED_BYTES + 1023) / 1024 + 1024 ))

          REMOTE_ARCHIVE="/var/tmp/shreks-release-$SOURCE_SHA.tar.gz"
          REMOTE_CHECKSUM="/var/tmp/shreks-release-$SOURCE_SHA.tar.gz.sha256"
          REMOTE_MANIFEST="/var/tmp/shreks-release-$SOURCE_SHA.RELEASE_MANIFEST.json"
          DISCOVERY_REQUEST_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$DISCOVERY_REQUEST_ID" =~ ^gha-[0-9]+-[0-9]+$ ]] || exit 2
          REMOTE_DISCOVERY_REQUEST="/var/tmp/shreks-fl9-v2-discovery.${DISCOVERY_REQUEST_ID}.request"
          REMOTE_DISCOVERY_RESULT_DIR="/dev/shm/shreks-fl9-v2-discovery.${DISCOVERY_REQUEST_ID}.result.d"
          REMOTE_DISCOVERY_RESULT_FILE="$REMOTE_DISCOVERY_RESULT_DIR/result.json"

          echo "remote staging preflight"
          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "set -e; test -d /var/tmp; test -w /var/tmp; printf 'var_tmp='; stat -c '%A %U:%G %a' /var/tmp; df -Pk /var/tmp; df -Pi /var/tmp; printf 'stale_exact_release_staging='; ls -l '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST' 2>/dev/null || echo none"
          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "rm -f '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST'"

          REMOTE_AVAIL_KB="$(ssh "${SSH_COMMON[@]}" "$DESTINATION" "df -Pk /var/tmp | tail -n 1 | awk '{print \$4}'")"
          if [[ ! "$REMOTE_AVAIL_KB" =~ ^[0-9]+$ ]]; then
            echo "unable to determine available /var/tmp space" >&2
            exit 2
          fi
          echo "required_kb=$REQUIRED_KB"
          echo "remote_available_kb=$REMOTE_AVAIL_KB"
          if (( REMOTE_AVAIL_KB < REQUIRED_KB )); then
            echo "insufficient remote /var/tmp space for verified release transfer" >&2
            exit 28
          fi

          TRANSFER_RC=0
          set +e
          scp "${SCP_COMMON[@]}" "$ARCHIVE" "$DESTINATION:$REMOTE_ARCHIVE"
          TRANSFER_RC=$?
          if (( TRANSFER_RC == 0 )); then
            scp "${SCP_COMMON[@]}" "$CHECKSUM" "$DESTINATION:$REMOTE_CHECKSUM"
            TRANSFER_RC=$?
          fi
          if (( TRANSFER_RC == 0 )); then
            scp "${SCP_COMMON[@]}" "$MANIFEST" "$DESTINATION:$REMOTE_MANIFEST"
            TRANSFER_RC=$?
          fi
          set -e
          if (( TRANSFER_RC != 0 )); then
            echo "verified release transfer failed; collecting remote staging diagnostics" >&2
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "df -Pk /var/tmp || true; df -Pi /var/tmp || true; ls -l '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST' 2>/dev/null || true" || true
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "rm -f '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST'" || true
            exit "$TRANSFER_RC"
          fi

          ssh "${SSH_COMMON[@]}" "$DESTINATION" "bash -s -- '$SOURCE_SHA' '$DISCOVERY_REQUEST_ID' '$REMOTE_DISCOVERY_REQUEST' '$REMOTE_DISCOVERY_RESULT_DIR'" <<'REMOTE_DISCOVERY'
          set -euo pipefail
          SOURCE_SHA="$1"
          REQUEST_ID="$2"
          REQUEST_PATH="$3"
          RESULT_DIR="$4"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REQUEST_ID" =~ ^gha-[0-9]+-[0-9]+$ ]] || exit 2
          test "$REQUEST_PATH" = "/var/tmp/shreks-fl9-v2-discovery.${REQUEST_ID}.request"
          test "$RESULT_DIR" = "/dev/shm/shreks-fl9-v2-discovery.${REQUEST_ID}.result.d"

          find /var/tmp -maxdepth 1 -type f -user "$(id -u)" \
            -name 'shreks-fl9-v2-discovery.gha-*.request' -delete
          rm -f "$RESULT_DIR/result.json"
          rmdir "$RESULT_DIR" 2>/dev/null || true
          install -d -m 0733 "$RESULT_DIR"
          test "$(stat -c %u "$RESULT_DIR")" = "$(id -u)"
          test "$(stat -c %a "$RESULT_DIR")" = 733

          python3 - "$REQUEST_ID" "$SOURCE_SHA" "$REQUEST_PATH" <<'PY'
          import json
          import os
          import sys
          import time

          request_id, expected_sha, output_path = sys.argv[1:]
          document = {
              "schema_name": "shreks.fl9_v2_discovery_control_request",
              "schema_version": 1,
              "request_id": request_id,
              "expected_release_sha": expected_sha,
              "created_at_unix_ms": time.time_ns() // 1_000_000,
          }
          payload = json.dumps(
              document,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          ) + "\n"
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          fd = os.open(output_path, flags, 0o644)
          try:
              offset = 0
              encoded = payload.encode("utf-8")
              while offset < len(encoded):
                  written = os.write(fd, encoded[offset:])
                  if written <= 0:
                      raise OSError("short write")
                  offset += written
              os.fsync(fd)
              os.fchmod(fd, 0o644)
              os.fsync(fd)
          finally:
              os.close(fd)
          PY
          test "$(stat -c %u "$REQUEST_PATH")" = "$(id -u)"
          test "$(stat -c %a "$REQUEST_PATH")" = 644
          REMOTE_DISCOVERY

          set +e
          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "sudo /usr/local/sbin/shreks-release-manager install '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST'"
          DEPLOY_RC=$?
          set -e

          if (( DEPLOY_RC != 0 )); then
            echo "release manager failed; collecting read-only host diagnostics" >&2
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "printf 'current_release='; readlink -f /opt/shreks/current || true; printf 'candidate_release_present='; if test -d '/opt/shreks/releases/$SOURCE_SHA'; then echo yes; else echo no; fi; systemctl is-active shreks.target || true; systemctl show shreks-observe.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks-paper-evidence.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks-paper-campaign.service -p ActiveState -p SubState -p NRestarts -p MainPID -p ExecMainStatus --no-pager || true; systemctl show shreks.target -p ActiveState -p SubState --no-pager || true" || true
            ssh "${SSH_COMMON[@]}" "$DESTINATION" \
              "rm -f '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST' '$REMOTE_DISCOVERY_REQUEST' '$REMOTE_DISCOVERY_RESULT_FILE'; rmdir '$REMOTE_DISCOVERY_RESULT_DIR' 2>/dev/null || true" || true
            exit "$DEPLOY_RC"
          fi

          ssh "${SSH_COMMON[@]}" "$DESTINATION" \
            "rm -f '$REMOTE_ARCHIVE' '$REMOTE_CHECKSUM' '$REMOTE_MANIFEST' '$REMOTE_DISCOVERY_REQUEST'"

  verify:
    needs: [resolve, deploy]
    uses: ./.github/workflows/verify-production-paper.yml
    with:
      expected_release_sha: ${{ needs.resolve.outputs.source_sha }}
      journal_minutes: "30"
      discovery_request_id: gha-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit
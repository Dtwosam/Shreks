name: FL1 storage parser patch

on:
  push:
    branches:
      - fix/fl1-realtime-provider-failover

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fl1-realtime-provider-failover
      - name: Patch Alchemy provider decoding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("crates/shreks-storage/src/fast_lane.rs"),
              Path("crates/shreks-storage/src/pump_swap_fast_lane.rs"),
          ]
          old = '        "helius" => Ok(ProviderId::Helius),\n        "jupiter" => Ok(ProviderId::Jupiter),'
          new = '        "helius" => Ok(ProviderId::Helius),\n        "alchemy" => Ok(ProviderId::Alchemy),\n        "jupiter" => Ok(ProviderId::Jupiter),'

          changed = False
          for path in paths:
              text = path.read_text()
              if '"alchemy" => Ok(ProviderId::Alchemy)' in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: parser anchor mismatch")
              path.write_text(text.replace(old, new, 1))
              changed = True

          if not changed:
              raise SystemExit(0)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/shreks-storage/src/fast_lane.rs crates/shreks-storage/src/pump_swap_fast_lane.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: decode Alchemy fast-lane provenance'
          git push origin HEAD:fix/fl1-realtime-provider-failover

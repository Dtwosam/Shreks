name: Chainstack branch rustfmt

on:
  push:
    branches:
      - fix/fl1-chainstack-realtime-fallback

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fl1-chainstack-realtime-fallback
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chainstack-rustfmt.yml
          git add crates
          git diff --cached --check
          git commit -m "style: format Chainstack realtime fallback"
          git push origin HEAD:fix/fl1-chainstack-realtime-fallback

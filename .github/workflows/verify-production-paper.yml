name: Verify production PAPER runtime

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Expected active sealed 40-character source commit
        required: true
        type: string
      journal_minutes:
        description: Read-only journal lookback window in minutes
        required: true
        default: "30"
        type: string
      discovery_request_id:
        description: Optional exact pre-staged FL9 discovery request ID
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      expected_release_sha:
        required: true
        type: string
      journal_minutes:
        required: false
        default: "30"
        type: string
      discovery_request_id:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    environment: production-paper
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      JOURNAL_MINUTES: ${{ inputs.journal_minutes }}
      PRESTAGED_DISCOVERY_REQUEST_ID: ${{ inputs.discovery_request_id }}
    steps:
      - name: Validate verifier inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$JOURNAL_MINUTES" =~ ^[0-9]{1,3}$ ]] || exit 2
          (( JOURNAL_MINUTES >= 1 && JOURNAL_MINUTES <= 240 )) || exit 2
          if [[ -n "$PRESTAGED_DISCOVERY_REQUEST_ID" ]]; then
            [[ "$PRESTAGED_DISCOVERY_REQUEST_ID" =~ ^gha-[0-9]+-[0-9]+$ ]] || exit 2
          fi

      - name: Verify runtime and probe historical evidence read-only
        shell: bash
        env:
          SHREKS_DEPLOY_HOST: ${{ secrets.SHREKS_DEPLOY_HOST }}
          SHREKS_DEPLOY_PORT: ${{ secrets.SHREKS_DEPLOY_PORT }}
          SHREKS_DEPLOY_USER: ${{ secrets.SHREKS_DEPLOY_USER }}
          SHREKS_DEPLOY_SSH_KEY: ${{ secrets.SHREKS_DEPLOY_SSH_KEY }}
          SHREKS_DEPLOY_KNOWN_HOSTS: ${{ secrets.SHREKS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SHREKS_DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 2
          [[ "$SHREKS_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 2
          [[ "$SHREKS_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          [[ -n "$SHREKS_DEPLOY_SSH_KEY" && -n "$SHREKS_DEPLOY_KNOWN_HOSTS" ]] || exit 2

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          KEY_FILE="$TEMP_DIR/deploy_key"
          KNOWN_HOSTS_FILE="$TEMP_DIR/known_hosts"
          umask 077
          printf '%s\n' "$SHREKS_DEPLOY_SSH_KEY" > "$KEY_FILE"
          printf '%s\n' "$SHREKS_DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$KNOWN_HOSTS_FILE"

          DESTINATION="$SHREKS_DEPLOY_USER@$SHREKS_DEPLOY_HOST"
          SSH_COMMON=(-i "$KEY_FILE" -p "$SHREKS_DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o BatchMode=yes)
          DISCOVERY_PRESTAGED=0
          if [[ -n "$PRESTAGED_DISCOVERY_REQUEST_ID" ]]; then
            DISCOVERY_REQUEST_ID="$PRESTAGED_DISCOVERY_REQUEST_ID"
            DISCOVERY_PRESTAGED=1
          else
            DISCOVERY_REQUEST_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          [[ "$DISCOVERY_REQUEST_ID" =~ ^gha-[0-9]+-[0-9]+$ ]] || exit 2
          VERIFY_LOG="$RUNNER_TEMP/shreks-production-paper-verification.log"
          ssh "${SSH_COMMON[@]}" "$DESTINATION" "bash -s -- '$EXPECTED_RELEASE_SHA' '$JOURNAL_MINUTES' '$DISCOVERY_REQUEST_ID' '$DISCOVERY_PRESTAGED'" <<'REMOTE' | tee "$VERIFY_LOG"
          set -euo pipefail
          EXPECTED_SHA="$1"
          JOURNAL_MINUTES="$2"
          REQUEST_ID="$3"
          PRESTAGED="$4"
          [[ "$REQUEST_ID" =~ ^gha-[0-9]+-[0-9]+$ ]] || exit 2
          [[ "$PRESTAGED" =~ ^[01]$ ]] || exit 2
          if [[ "$PRESTAGED" == 1 ]]; then
            PRESTAGED_RESULT_DIR="/dev/shm/shreks-fl9-v2-discovery.${REQUEST_ID}.result.d"
            PRESTAGED_RESULT_FILE="$PRESTAGED_RESULT_DIR/result.json"
            cleanup_prestaged_discovery() {
              rm -f "$PRESTAGED_RESULT_FILE"
              rmdir "$PRESTAGED_RESULT_DIR" 2>/dev/null || true
            }
            trap cleanup_prestaged_discovery EXIT
          fi
          CURRENT="$(readlink -f /opt/shreks/current)"
          EXPECTED="/opt/shreks/releases/$EXPECTED_SHA"
          printf 'current_release=%s\nexpected_release=%s\n' "$CURRENT" "$EXPECTED"
          test "$CURRENT" = "$EXPECTED"

          MANIFEST_SHA="$(python3 - <<'PY'
          import json
          with open('/opt/shreks/current/RELEASE_MANIFEST.json', encoding='utf-8') as handle:
              print(json.load(handle)['source_sha'])
          PY
          )"
          printf 'manifest_source_sha=%s\n' "$MANIFEST_SHA"
          test "$MANIFEST_SHA" = "$EXPECTED_SHA"

          ENTRY_SIZING="/opt/shreks/current/.venv/bin/shreks-g1c-v2-entry-sizing-proposal"
          test -f "$ENTRY_SIZING"
          test ! -L "$ENTRY_SIZING"
          test -x "$ENTRY_SIZING"
          ENTRY_SIZING_RESOLVED="$(readlink -f "$ENTRY_SIZING")"
          test "$ENTRY_SIZING_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-entry-sizing-proposal"
          ENTRY_SIZING_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_entry_sizing_proposal as entry_sizing

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(entry_sizing.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "entry sizing proposal module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$ENTRY_SIZING_MODULE"
          printf 'g1c_v2_entry_sizing_proposal=present\n'
          printf 'g1c_v2_entry_sizing_proposal_path=%s\n' "$ENTRY_SIZING_RESOLVED"
          printf 'g1c_v2_entry_sizing_proposal_module=%s\n' "$ENTRY_SIZING_MODULE"

          QUOTE_REFERENCE="/opt/shreks/current/.venv/bin/shreks-g1c-v2-quote-valuation-reference"
          test -f "$QUOTE_REFERENCE"
          test ! -L "$QUOTE_REFERENCE"
          test -x "$QUOTE_REFERENCE"
          QUOTE_REFERENCE_RESOLVED="$(readlink -f "$QUOTE_REFERENCE")"
          test "$QUOTE_REFERENCE_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-quote-valuation-reference"
          QUOTE_REFERENCE_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_quote_valuation_reference as quote_reference

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(quote_reference.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "quote valuation reference module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$QUOTE_REFERENCE_MODULE"
          printf 'g1c_v2_quote_valuation_reference=present\n'
          printf 'g1c_v2_quote_valuation_reference_path=%s\n' "$QUOTE_REFERENCE_RESOLVED"
          printf 'g1c_v2_quote_valuation_reference_module=%s\n' "$QUOTE_REFERENCE_MODULE"

          QUOTE_REVIEW="/opt/shreks/current/.venv/bin/shreks-g1c-v2-quote-valuation-review"
          test -f "$QUOTE_REVIEW"
          test ! -L "$QUOTE_REVIEW"
          test -x "$QUOTE_REVIEW"
          QUOTE_REVIEW_RESOLVED="$(readlink -f "$QUOTE_REVIEW")"
          test "$QUOTE_REVIEW_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-quote-valuation-review"
          QUOTE_REVIEW_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_quote_valuation_review as quote_review

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(quote_review.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "quote valuation review module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$QUOTE_REVIEW_MODULE"
          printf 'g1c_v2_quote_valuation_review=present\n'
          printf 'g1c_v2_quote_valuation_review_path=%s\n' "$QUOTE_REVIEW_RESOLVED"
          printf 'g1c_v2_quote_valuation_review_module=%s\n' "$QUOTE_REVIEW_MODULE"

          REVIEW_BACKED_ENTRY_SIZING="/opt/shreks/current/.venv/bin/shreks-g1c-v2-review-backed-entry-sizing"
          test -f "$REVIEW_BACKED_ENTRY_SIZING"
          test ! -L "$REVIEW_BACKED_ENTRY_SIZING"
          test -x "$REVIEW_BACKED_ENTRY_SIZING"
          REVIEW_BACKED_ENTRY_SIZING_RESOLVED="$(readlink -f "$REVIEW_BACKED_ENTRY_SIZING")"
          test "$REVIEW_BACKED_ENTRY_SIZING_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-review-backed-entry-sizing"
          REVIEW_BACKED_ENTRY_SIZING_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_review_backed_entry_sizing as review_backed_entry_sizing

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(review_backed_entry_sizing.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "review-backed entry sizing module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$REVIEW_BACKED_ENTRY_SIZING_MODULE"
          printf 'g1c_v2_review_backed_entry_sizing=present\n'
          printf 'g1c_v2_review_backed_entry_sizing_path=%s\n' "$REVIEW_BACKED_ENTRY_SIZING_RESOLVED"
          printf 'g1c_v2_review_backed_entry_sizing_module=%s\n' "$REVIEW_BACKED_ENTRY_SIZING_MODULE"

          CANDIDATE_VALUE_DECISION="/opt/shreks/current/.venv/bin/shreks-g1c-v2-candidate-value-decision"
          test -f "$CANDIDATE_VALUE_DECISION"
          test ! -L "$CANDIDATE_VALUE_DECISION"
          test -x "$CANDIDATE_VALUE_DECISION"
          CANDIDATE_VALUE_DECISION_RESOLVED="$(readlink -f "$CANDIDATE_VALUE_DECISION")"
          test "$CANDIDATE_VALUE_DECISION_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-candidate-value-decision"
          CANDIDATE_VALUE_DECISION_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_candidate_value_decision as candidate_value_decision

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(candidate_value_decision.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "candidate value decision module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$CANDIDATE_VALUE_DECISION_MODULE"
          printf 'g1c_v2_candidate_value_decision=present\n'
          printf 'g1c_v2_candidate_value_decision_path=%s\n' "$CANDIDATE_VALUE_DECISION_RESOLVED"
          printf 'g1c_v2_candidate_value_decision_module=%s\n' "$CANDIDATE_VALUE_DECISION_MODULE"

          DECISION_BACKED_CANDIDATE_AUTHORITY="/opt/shreks/current/.venv/bin/shreks-g1c-v2-decision-backed-candidate-authority-bind"
          test -f "$DECISION_BACKED_CANDIDATE_AUTHORITY"
          test ! -L "$DECISION_BACKED_CANDIDATE_AUTHORITY"
          test -x "$DECISION_BACKED_CANDIDATE_AUTHORITY"
          DECISION_BACKED_CANDIDATE_AUTHORITY_RESOLVED="$(readlink -f "$DECISION_BACKED_CANDIDATE_AUTHORITY")"
          test "$DECISION_BACKED_CANDIDATE_AUTHORITY_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-decision-backed-candidate-authority-bind"
          DECISION_BACKED_CANDIDATE_AUTHORITY_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_decision_backed_candidate_authority as decision_backed_candidate_authority

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(decision_backed_candidate_authority.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "decision-backed candidate authority module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$DECISION_BACKED_CANDIDATE_AUTHORITY_MODULE"
          printf 'g1c_v2_decision_backed_candidate_authority=present\n'
          printf 'g1c_v2_decision_backed_candidate_authority_path=%s\n' "$DECISION_BACKED_CANDIDATE_AUTHORITY_RESOLVED"
          printf 'g1c_v2_decision_backed_candidate_authority_module=%s\n' "$DECISION_BACKED_CANDIDATE_AUTHORITY_MODULE"

          DECISION_BACKED_CANDIDATE_AUTHORING="/opt/shreks/current/.venv/bin/shreks-g1c-v2-decision-backed-candidate-author"
          test -f "$DECISION_BACKED_CANDIDATE_AUTHORING"
          test ! -L "$DECISION_BACKED_CANDIDATE_AUTHORING"
          test -x "$DECISION_BACKED_CANDIDATE_AUTHORING"
          DECISION_BACKED_CANDIDATE_AUTHORING_RESOLVED="$(readlink -f "$DECISION_BACKED_CANDIDATE_AUTHORING")"
          test "$DECISION_BACKED_CANDIDATE_AUTHORING_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-decision-backed-candidate-author"
          DECISION_BACKED_CANDIDATE_AUTHORING_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_decision_backed_candidate_authoring as decision_backed_candidate_authoring

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(decision_backed_candidate_authoring.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "decision-backed candidate authoring module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$DECISION_BACKED_CANDIDATE_AUTHORING_MODULE"
          printf 'g1c_v2_decision_backed_candidate_authoring=present\n'
          printf 'g1c_v2_decision_backed_candidate_authoring_path=%s\n' "$DECISION_BACKED_CANDIDATE_AUTHORING_RESOLVED"
          printf 'g1c_v2_decision_backed_candidate_authoring_module=%s\n' "$DECISION_BACKED_CANDIDATE_AUTHORING_MODULE"

          CANDIDATE_AUTHORITY="/opt/shreks/current/.venv/bin/shreks-g1c-v2-runtime-manifest-candidate-authority-bind"
          test -f "$CANDIDATE_AUTHORITY"
          test ! -L "$CANDIDATE_AUTHORITY"
          test -x "$CANDIDATE_AUTHORITY"
          CANDIDATE_AUTHORITY_RESOLVED="$(readlink -f "$CANDIDATE_AUTHORITY")"
          test "$CANDIDATE_AUTHORITY_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-runtime-manifest-candidate-authority-bind"
          CANDIDATE_AUTHORITY_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_runtime_manifest_candidate_authority as candidate_authority

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(candidate_authority.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "candidate authority module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$CANDIDATE_AUTHORITY_MODULE"
          printf 'g1c_v2_candidate_authority=present\n'
          printf 'g1c_v2_candidate_authority_path=%s\n' "$CANDIDATE_AUTHORITY_RESOLVED"
          printf 'g1c_v2_candidate_authority_module=%s\n' "$CANDIDATE_AUTHORITY_MODULE"

          INSTALL_PLANNER="/opt/shreks/current/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install-plan"
          test -f "$INSTALL_PLANNER"
          test ! -L "$INSTALL_PLANNER"
          test -x "$INSTALL_PLANNER"
          INSTALL_PLANNER_RESOLVED="$(readlink -f "$INSTALL_PLANNER")"
          test "$INSTALL_PLANNER_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install-plan"
          INSTALL_PLANNER_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_paper_manifest_manager_install_plan as planner

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(planner.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "install planner module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$INSTALL_PLANNER_MODULE"
          printf 'paper_manifest_manager_install_planner=present\n'
          printf 'paper_manifest_manager_install_planner_path=%s\n' "$INSTALL_PLANNER_RESOLVED"
          printf 'paper_manifest_manager_install_planner_module=%s\n' "$INSTALL_PLANNER_MODULE"

          ROTATION_READINESS="/opt/shreks/current/.venv/bin/shreks-g1c-v2-paper-manifest-rotation-readiness"
          test -f "$ROTATION_READINESS"
          test ! -L "$ROTATION_READINESS"
          test -x "$ROTATION_READINESS"
          ROTATION_READINESS_RESOLVED="$(readlink -f "$ROTATION_READINESS")"
          test "$ROTATION_READINESS_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-paper-manifest-rotation-readiness"
          ROTATION_READINESS_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_paper_manifest_rotation_readiness as readiness

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(readiness.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "rotation readiness module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$ROTATION_READINESS_MODULE"
          printf 'paper_manifest_rotation_readiness=present\n'
          printf 'paper_manifest_rotation_readiness_path=%s\n' "$ROTATION_READINESS_RESOLVED"
          printf 'paper_manifest_rotation_readiness_module=%s\n' "$ROTATION_READINESS_MODULE"

          INSTALLER="/opt/shreks/current/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install"
          test -f "$INSTALLER"
          test ! -L "$INSTALLER"
          test -x "$INSTALLER"
          INSTALLER_RESOLVED="$(readlink -f "$INSTALLER")"
          test "$INSTALLER_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install"
          INSTALLER_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_paper_manifest_manager_install as installer

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(installer.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "manifest manager installer module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$INSTALLER_MODULE"
          printf 'paper_manifest_manager_installer=present\n'
          printf 'paper_manifest_manager_installer_path=%s\n' "$INSTALLER_RESOLVED"
          printf 'paper_manifest_manager_installer_module=%s\n' "$INSTALLER_MODULE"

          INSTALL_PROOF="/opt/shreks/current/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install-proof"
          test -f "$INSTALL_PROOF"
          test ! -L "$INSTALL_PROOF"
          test -x "$INSTALL_PROOF"
          INSTALL_PROOF_RESOLVED="$(readlink -f "$INSTALL_PROOF")"
          test "$INSTALL_PROOF_RESOLVED" = "$EXPECTED/.venv/bin/shreks-g1c-v2-paper-manifest-manager-install-proof"
          INSTALL_PROOF_MODULE="$(
            EXPECTED_RELEASE="$EXPECTED" /opt/shreks/current/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import shreks_brain.g1c_v2_paper_manifest_manager_installation_proof as installation_proof

          expected_release = Path(os.environ["EXPECTED_RELEASE"]).resolve()
          module_path = Path(installation_proof.__file__).resolve()
          try:
              module_path.relative_to(expected_release)
          except ValueError as error:
              raise SystemExit(
                  "manifest manager installation proof module is outside the exact deployed release"
              ) from error
          print(module_path)
          PY
          )"
          test -n "$INSTALL_PROOF_MODULE"
          printf 'paper_manifest_manager_installation_proof=present\n'
          printf 'paper_manifest_manager_installation_proof_path=%s\n' "$INSTALL_PROOF_RESOLVED"
          printf 'paper_manifest_manager_installation_proof_module=%s\n' "$INSTALL_PROOF_MODULE"

          PAPER_MANIFEST_MANAGER_STATUS_JSON="$(
            /opt/shreks/current/.venv/bin/shreks-g1c-v2-paper-manifest-manager-status "$EXPECTED_SHA"
          )"
          printf 'paper_manifest_manager_status_json=%s\n' "$PAPER_MANIFEST_MANAGER_STATUS_JSON"
          PAPER_MANIFEST_MANAGER_STATUS="$(
            PAPER_MANIFEST_MANAGER_STATUS_JSON="$PAPER_MANIFEST_MANAGER_STATUS_JSON" \
              /opt/shreks/current/.venv/bin/python - <<'PY'
          import json
          import os

          document = json.loads(os.environ["PAPER_MANIFEST_MANAGER_STATUS_JSON"])
          allowed = {
              "ABSENT",
              "MATCHED_CURRENT_RELEASE",
              "PRESENT_DIFFERENT_BYTES",
              "PRESENT_METADATA_MISMATCH",
              "PRESENT_UNSAFE_TYPE",
          }
          if document.get("schema_name") != "shreks.g1c_v2_paper_manifest_manager_status":
              raise SystemExit("helper status schema mismatch")
          if document.get("schema_version") != 1:
              raise SystemExit("helper status schema version mismatch")
          if document.get("observation_authority") != "READ_ONLY":
              raise SystemExit("helper status observation authority mismatch")
          if document.get("installation_authority") != "NOT_EXERCISED":

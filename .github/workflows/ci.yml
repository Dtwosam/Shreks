name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Reject committed secret assignments
        shell: bash
        run: |
          set -euo pipefail
          pattern='(PRIVATE_''KEY|SEED_''PHRASE|SECRET_''KEY)='
          if git grep -n -E "$pattern" -- ':!docs/**' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Potential secret assignment found in committed source."
            exit 1
          fi
          echo "No forbidden secret assignments found."

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Check changed Rust formatting
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            head_sha="$(git rev-parse HEAD)"
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t changed_rust < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- '*.rs'
          )

          cargo fmt --all
          if (( ${#changed_rust[@]} > 0 )) && ! git diff --quiet -- "${changed_rust[@]}"; then
            echo "Changed Rust files are not rustfmt-clean:"
            git diff -- "${changed_rust[@]}"
            exit 1
          fi

          # cargo fmt may expose pre-existing formatting debt in unchanged files.
          # Restore the exact checked-out tree before semantic gates run.
          git reset --hard HEAD
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        run: python -m pip install -e './python[dev]'
      - name: Run Python tests
        run: python -m pytest python/tests -q

  arm64-release-build:
    name: ARM64 release build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Build and verify native ARM64 release
        shell: bash
        env:
          PLATFORM: aarch64-unknown-linux-gnu
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          deploy/release/build_release.sh "$SOURCE_SHA"
          python deploy/release/release_bundle.py verify \
            --archive "dist/release/shreks-release-$SOURCE_SHA.tar.gz" \
            --checksum "dist/release/shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            --manifest dist/release/RELEASE_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/release/RELEASE_MANIFEST.json").read_text())
          assert manifest["platform"] == "aarch64-unknown-linux-gnu"
          PY

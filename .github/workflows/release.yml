name: Build sealed Shreks release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact sealed 40-character source commit
        required: true
        type: string
      platform:
        description: Native Linux GNU release platform
        required: true
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.platform == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: ${{ inputs.platform }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hex characters" >&2
            exit 2
          fi
          case "$PLATFORM" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu)
              ;;
            *)
              echo "unsupported release platform: $PLATFORM" >&2
              exit 2
              ;;
          esac

      - name: Checkout exact source SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Confirm exact sealed commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "checkout does not match requested source SHA" >&2
            exit 2
          fi
          SUBJECT="$(git log -1 --format=%s)"
          if ! printf '%s\n' "$SUBJECT" | grep -qi 'seal'; then
            echo "requested source commit is not a seal commit" >&2
            exit 2
          fi

      - name: Reject committed secret assignments
        shell: bash
        run: |
          set -euo pipefail
          pattern='(PRIVATE_''KEY|SEED_''PHRASE|SECRET_''KEY)='
          if git grep -n -E "$pattern" -- ':!docs/**' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Potential secret assignment found in committed source."
            exit 1
          fi
          echo "No forbidden secret assignments found."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Install Python package
        run: python -m pip install -e './python[dev]'

      - name: Run Python tests
        run: python -m pytest python/tests -q

      - name: Build and verify release bundle
        shell: bash
        run: deploy/release/build_release.sh "$SOURCE_SHA"

      - name: Reject duplicate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="shreks-$SOURCE_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 2
          fi

      - name: Create immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="shreks-$SOURCE_SHA"
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes "Verified Shreks release for sealed source SHA $SOURCE_SHA on $PLATFORM." \
            "dist/release/shreks-release-$SOURCE_SHA.tar.gz" \
            "dist/release/shreks-release-$SOURCE_SHA.tar.gz.sha256" \
            "dist/release/RELEASE_MANIFEST.json"
